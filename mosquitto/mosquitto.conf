listener 8883 0.0.0.0
cafile /mosquitto/pki/ca.crt.pem
certfile /mosquitto/pki/mqtt-broker.crt.pem
keyfile /mosquitto/pki/mqtt-broker.key.pem
crlfile /mosquitto/pki/current/crl.pem
acl_file /mosquitto/pki/current/acl
require_certificate true
use_identity_as_username true
allow_anonymous false
persistence true
persistence_location /mosquitto/data/
pid_file /mosquitto/runtime/mosquitto.pid
log_dest stdout
