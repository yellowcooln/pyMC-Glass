name: Glass PR quality

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glass-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No untrusted event text is interpolated into shell commands.
jobs:
  backend:
    name: Backend lint and fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      PKI_STATE_DIR: ${{ runner.temp }}/glass-test-pki
      MQTT_INGEST_ENABLED: "false"
      ALERT_POLICY_MONITOR_ENABLED: "false"
      ALERT_ACTION_DISPATCHER_ENABLED: "false"
      BOOTSTRAP_SEED_ADMIN_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend development dependencies
        run: python -m pip install -e 'backend[dev]'
      - name: Backend lint
        working-directory: backend
        run: python -m ruff check app tests
      - name: Backend unit and isolated API fixture tests
        working-directory: backend
        run: python -m pytest tests

  frontend:
    name: Frontend lint, unit, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Frontend lint
        run: npm run lint
      - name: Frontend unit and component tests
        run: npm run test:unit
      - name: Strict Vue and TypeScript checks
        run: npm run typecheck
      - name: Frontend production build
        run: npm run build
